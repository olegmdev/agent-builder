name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # This fork publishes to the custom domain ai-agent-builder.incode-group.com,
      # so the app is served from the domain root, not from /<repo-name>/.
      - run: pnpm build
        env:
          # Catalog stays on the bundled mocks (there is no catalog API); only form
          # submissions go out, to the Make.com hook below.
          VITE_API_MODE: mock
          VITE_BASE: /
          VITE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          VITE_SUBMIT_SECRET: ${{ secrets.MAKE_SUBMIT_SECRET }}
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links load the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
