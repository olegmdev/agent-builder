<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same marks incode-group.com serves: the spiral for the tab, the wordmark for
         an iOS home-screen bookmark. Both are byte-identical to theirs. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#7cb342" />
    <!--
      Everything between the markers is rewritten per route and per locale by
      scripts/prerender-seo.mjs after the build. The defaults below are the English landing
      page, which is what `pnpm dev` and `pnpm preview` serve before that step runs.
    -->
    <!-- seo:start -->
    <title>Build an AI Agent for Your Business | Incode Group</title>
    <meta
      name="description"
      content="Answer a few questions and see which tasks you can hand over to AI, what skills your agent needs, and what it would take to build. Under 5 minutes."
    />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
